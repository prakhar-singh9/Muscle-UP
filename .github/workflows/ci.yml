name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, admin-portal-auth-followup]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from bun.lock
        run: bun install
      - name: Type-check
        run: bun run lint
      - name: Build
        run: bun run build
